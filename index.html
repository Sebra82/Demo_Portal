<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictive Analog Forecasting Studio - SEBRA82</title>
    <style>
        body {
            margin: 0;
            background: #010103;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(4, 4, 12, 0.85);
            padding: 18px 22px;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
            z-index: 10;
            min-width: 300px;
            pointer-events: none;
        }
        h2 { margin: 0 0 12px 0; font-size: 15px; letter-spacing: 2px; color: #ff007f; }
        p { margin: 6px 0; font-size: 13px; display: flex; justify-content: space-between; }
        span.val { color: #ffffff; font-weight: bold; }
        .hud-divider { border-bottom: 1px dashed #333; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="hud">
        <h2>SEBRA82 PREDICTIVE STUDIO</h2>
        <p>Engine State: <span class="val">Continuous Forecasting</span></p>
        <p>Quantum Noise Nodes: <span class="val">250,000</span></p>
        <div class="hud-divider"></div>
        <p>Prediction Horizon: <span class="val" style="color: #ff007f;">+48 Cycles</span></p>
        <p>Frame Latency: <span class="val" id="latency-display">0.00 ms</span></p>
        <p>Frame Rate: <span class="val" id="fps-display">60 FPS</span></p>
    </div>

    <canvas id="sebraCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sebraCanvas');
        const ctx = canvas.getContext('2d');

        let RENDER_WIDTH = window.innerWidth;
        let RENDER_HEIGHT = window.innerHeight;
        canvas.width = RENDER_WIDTH;
        canvas.height = RENDER_HEIGHT;

        window.addEventListener('resize', () => {
            RENDER_WIDTH = window.innerWidth;
            RENDER_HEIGHT = window.innerHeight;
            canvas.width = RENDER_WIDTH;
            canvas.height = RENDER_HEIGHT;
        });

        const LUT_SIZE = 7200;
        const SIN_LUT = new Float32Array(LUT_SIZE);
        for (let i = 0; i < LUT_SIZE; i++) {
            SIN_LUT[i] = Math.sin((i * Math.PI * 2) / LUT_SIZE);
        }

        const SIGNAL_LENGTH = 1200; 
        const signalBuffer = new Float32Array(SIGNAL_LENGTH);
        const PROB_NODES = 250000;

        let globalTick = 0;
        let lastTime = performance.now();

        function generateHistoricalData(offset) {
            let val = 0;
            val += SIN_LUT[Math.floor((offset * 12) % LUT_SIZE)] * 1.0; 
            val += SIN_LUT[Math.floor((offset * 25) % LUT_SIZE)] * 0.5;
            val += SIN_LUT[Math.floor((offset * 7) % LUT_SIZE)] * 1.5;
            return val;
        }

        function masterLoop() {
            let frameStart = performance.now();
            globalTick += 2;

            ctx.fillStyle = '#010103';
            ctx.fillRect(0, 0, RENDER_WIDTH, RENDER_HEIGHT);

            let centerY = RENDER_HEIGHT / 2;
            let currentNowX = RENDER_WIDTH * 0.65;

            ctx.beginPath();
            ctx.lineWidth = 2.5;
            
            for (let i = 0; i < SIGNAL_LENGTH; i++) {
                let x = (i / SIGNAL_LENGTH) * RENDER_WIDTH;
                let dataOffset = globalTick + i;
                let priceY = generateHistoricalData(dataOffset);
                let finalY = centerY - (priceY * 80);

                if (i === 0) {
                    ctx.moveTo(x, finalY);
                } else {
                    ctx.lineTo(x, finalY);
                }
                signalBuffer[i] = finalY;
            }

            let gradient = ctx.createLinearGradient(0, 0, RENDER_WIDTH, 0);
            gradient.addColorStop(0.0, "rgba(0, 255, 204, 0.1)");
            gradient.addColorStop(0.64, "rgba(0, 255, 204, 1.0)");
            gradient.addColorStop(0.66, "rgba(255, 0, 127, 1.0)");
            gradient.addColorStop(1.0, "rgba(255, 0, 127, 0.2)");
            
            ctx.strokeStyle = gradient;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 0, 127, 0.15)';
            for (let i = 0; i < PROB_NODES; i++) {
                let futureNorm = Math.pow(Math.random(), 1.5); 
                let x = currentNowX + (futureNorm * (RENDER_WIDTH - currentNowX));
                
                let signalIdx = Math.floor((x / RENDER_WIDTH) * SIGNAL_LENGTH);
                signalIdx = Math.min(Math.max(signalIdx, 0), SIGNAL_LENGTH - 1);
                let anchorY = signalBuffer[signalIdx];

                let uncertainty = futureNorm * 180; 
                let phase = SIN_LUT[Math.floor((globalTick * 5 + i) % LUT_SIZE)] * Math.PI;
                let spread = Math.sin(phase) * uncertainty * Math.random();
                let y = anchorY + spread;

                ctx.fillRect(x, y, 1.2, 1.2);
            }

            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.moveTo(currentNowX, 0);
            ctx.lineTo(currentNowX, RENDER_HEIGHT);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Courier New';
            ctx.fillText('CURRENT STATE ->', currentNowX - 120, 30);
            ctx.fillStyle = '#ff007f';
            ctx.fillText('<- PREDICTIVE ANOMALY ZONE', currentNowX + 15, 30);

            let frameEnd = performance.now();
            let duration = frameEnd - frameStart;

            if (frameEnd - lastTime >= 250) {
                document.getElementById('latency-display').textContent = duration.toFixed(2) + ' ms';
                document.getElementById('fps-display').textContent = Math.round(1000 / (duration || 1)) + ' FPS';
                lastTime = frameEnd;
            }

            requestAnimationFrame(masterLoop);
        }

        requestAnimationFrame(masterLoop);
    </script>
</body>
</html>
