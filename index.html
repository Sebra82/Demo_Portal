<!DOCTYPE html><html><head><meta charset="utf-8"><title>Show</title><style>
body{margin:0;overflow:hidden;background:#000;font-family:monospace}
#u{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
button{background:#111;color:#fff;border:1px solid #444;padding:8px 16px;cursor:pointer;font-size:11px}
#l{position:absolute;top:20px;left:20px;color:#fff;font-size:12px;background:rgba(0,0,0,.7);padding:8px}
</style></head><body><div id="l">INIT...</div><div id="u">
<button onclick="s(1)">Act I</button><button onclick="s(2)">Act II</button><button onclick="s(3)">Act III</button>
</div><script src="https://cloudflare.com"></script><script>
let scene, camera, renderer, mesh, unif = {uT:{value:0},uA:{value:1}};
try {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    let mat = new THREE.ShaderMaterial({
        uniforms: unif,
        vertexShader: `uniform float uT, uA; varying vec3 vP;
            void main(){
                vec3 p = position; float r = length(p.xy);
                if(uA>=1.0){ p.z-=1.8/(r+0.25); float a=uT*4.0+(p.z*1.8); float c=cos(a),s=sin(a); p.xy=mat2(c,-s,s,c)*p.xy; }
                if(uA==2.0){ p.x+=sin(p.z*5.0+uT*7.0)*0.12; p.y+=cos(p.z*5.0+uT*7.0)*0.12; }
                if(uA==3.0){ p.z=-2.5; }
                vec4 w = instanceMatrix * vec4(p, 1.0);
                if(uA==2.0){ w.y+=sin(w.x*0.08+uT*2.0)*3.5; w.z+=cos(w.y*0.08+uT*2.0)*3.5; }
                vP = w.xyz; gl_Position = projectionMatrix * modelViewMatrix * w;
            }`,
        fragmentShader: `uniform float uA; void main(){
                vec3 c = vec3(0,1,0.4); if(uA==2.0)c=vec3(1,0.65,0); if(uA==3.0)c=vec3(1,0,0.2);
                gl_FragColor = vec4(c, 0.85);
            }`
    });
    
    mesh = new THREE.InstancedMesh(new THREE.EdgesGeometry(new THREE.CylinderGeometry(1,0.05,3.5,6,6,true)), mat, 1000);
    let dummy = new THREE.Object3D(), idx=0;
    for(let x=0;x<10;x++) for(let y=0;y<10;y++) for(let z=0;z<10;z++){
        dummy.position.set((x-4.5)*6, (y-4.5)*6, (z-4.5)*6); dummy.updateMatrix(); mesh.setMatrixAt(idx++, dummy.matrix);
    }
    scene.add(mesh); camera.position.set(40,40,50); camera.lookAt(0,0,0);
    s(1);
    
    let clock = new THREE.Clock();
    function tick(){
        requestAnimationFrame(tick); let t = clock.getElapsedTime(); unif.uT.value = t;
        if(unif.uA.value!==3.0){ mesh.rotation.y=t*0.04; camera.position.x=Math.sin(t*0.15)*60; camera.position.z=Math.cos(t*0.15)*60; camera.lookAt(0,0,0); }
        else{ camera.position.set(0,75,5); camera.lookAt(0,0,0); }
        renderer.render(scene, camera);
    }
    tick();
} catch(e) { fallback(); }

function s(act){
    unif.uA.value = act * 1.0;
    document.getElementById('l').innerHTML = act==1 ? "ACT I: GREEN VORTEX ($m=E/c^2$)" : act==2 ? "ACT II: AMBER SUPERPOSITION" : "ACT III: RED REGISTRATION COLLAPSE";
}
function fallback(){
    document.body.innerHTML = "<div id='l'>WEBGL FAILURE. RUNNING SECURE TERMINAL DATA MODE.</div>";
}
window.addEventListener('resize', ()=>{ if(camera&&renderer){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }});
</script></body></html>
