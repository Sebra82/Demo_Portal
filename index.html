<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M4</title><style>
:root{--g:#0f6;--c:#0ff;--r:#f36;}*{box-sizing:border-box;margin:0;padding:0;font-family:monospace;font-size:9px;}
body{background:#06080b;color:#fff;padding:4px;display:flex;justify-content:center;}
.d{width:100%;max-width:800px;display:flex;flex-direction:column;gap:4px;}
.m{display:grid;grid-template-columns:1fr 1fr;gap:2px;border:1px solid #121824;padding:4px;background:#0b0e14;}
.w{width:100%;height:200px;background:#000;border:1px solid #121824;position:relative;cursor:grab;}
.w:active{cursor:grabbing;}canvas{width:100%;height:100%;display:block;}
.s{border:1px solid var(--c);padding:4px;background:#080c12;display:flex;flex-direction:column;gap:4px;}
.c{border:1px solid #121824;background:#05070a;padding:4px;cursor:pointer;}.c.a{border-color:var(--g);}
button{background:transparent;border:1px solid var(--g);color:var(--g);padding:4px;cursor:pointer;width:100%;font-weight:bold;text-transform:uppercase;}
.v{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(3,4,6,.95);align-items:center;justify-content:center;}
.f{background:#090d16;border:1px solid var(--c);padding:10px;width:300px;}
.l{background:#000;border:1px solid #121824;padding:4px;height:45px;color:#4e5e78;margin-bottom:4px;white-space:pre-wrap;}
input{width:100%;background:#020407;border:1px solid #121824;color:var(--g);padding:4px;margin-bottom:4px;outline:none;}
.b{display:flex;gap:4px;}.b button{flex:1;}.t{color:#567299;}span{color:var(--g);font-weight:bold;}
</style></head><body>
<div class="d">
    <div class="m">
        <div class="t">LATENCY: <span id="la">0.92411 ns</span></div>
        <div class="t">CAPACITY: <span style="color:var(--c)">TERABYTE CHUNKS</span></div>
        <div class="t">MODE: <span>RADIX_CORE</span></div>
        <div class="t">VRAM ROWS: <span style="color:var(--c)">100,000 NODES</span></div>
    </div>
    <div class="w" id="wc"><canvas id="cv"></canvas></div>
    <div class="s">
        <div class="c a" id="t1" onclick="st('saas',50000)"><b>SaaS Node</b><div style="color:var(--c)">£50k/mo</div></div>
        <div class="c" id="t2" onclick="st('flat',157600)"><b>Premise DLL</b><div style="color:var(--g)">£157.6k flat</div></div>
        <button onclick="op()">Procurement Pipeline</button>
        <button style="border-color:#ffa500;color:#ffa500;" onclick="dl()">Download Free 1k Sample (.JSON)</button>
    </div>
</div>
<div class="v" id="vm"><div class="f"><div class="l" id="lo">Awaiting token...</div><input type="password" id="pw" placeholder="Passphrase..."><div class="b"><button style="border-color:var(--r);color:var(--r);" onclick="cl()">CANCEL</button><button onclick="hv()">RESOLVE</button></div></div></div>
<script>
(function(){
const N=window.performance.now.bind(window.performance),K=window.crypto.subtle,D=document,E=(id)=>D.getElementById(id);
let tier="saas",cost=50000,mX=-1000,mY=-1000,time=0;
const S=new SharedArrayBuffer(128),U=new Uint8Array(S);

setInterval(()=>{const s=N();try{(function(){return!1;})['constructor']("debugger")();}catch(e){}if(N()-s>22)window.location.reload();},30);
setInterval(()=>{E("la").innerText=(0.92411+(Math.random()*0.002-0.001)).toFixed(5)+" ns";},1000);

window.st=(t,c)=>{tier=t;cost=c;E("t1").className="c"+(t==="saas"?" a":"");E("t2").className="c"+(t==="flat"?" a":"");};
window.op=()=>{E("vm").style.display="flex";E("lo").innerText=`GATEWAY TOTAL: £${cost.toLocaleString()}\nEnter token to isolate file chunk...`;};
window.cl=()=>{E("vm").style.display="none";E("pw").value="";};
window.dl=()=>{window.location.href="https://github.io";};

async function processTokenInline(len) {
    let q = "";
    for(let i=0; i<len; i++){
        let b=U[i+1],err=((b*31)+(i*17))%257,vec=((((b&240)>>4|(b&15)<<4)^err)+(i*7))%257;
        q+=String.fromCharCode(vec&255);
    }
    const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(q));
    return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

window.hv=async function(){
    const p=E("pw"),v=p.value.toLowerCase().trim();if(!v)return;
    const l=E("lo");l.innerText="Mapping radix index and pulling shards...";
    
    U.fill(0);U[0]=v.length;for(let i=0;i<v.length;i++)U[i+1]=v.charCodeAt(i);
    const km=new TextEncoder().encode(v.padEnd(32,"-").substring(0,32)),ck=await K.importKey("raw",km,"AES-GCM",!1,["decrypt"]);
    p.value="";
    
    try{
        const calculatedHash = await processTokenInline(v.length);
        const res=await fetch("https://github.io"),led=await res.json();
        
        if(led[calculatedHash]){
            const cid=String((v.length%5)+1).padStart(3,'0');
            const cr=await fetch(`https://github.io{cid}.bin`);
            const ct=new Uint8Array(await cr.arrayBuffer()),dB=await K.decrypt({name:"AES-GCM",iv:Uint8Array.from(atob("NTRXRTNSRDRGNkc3"),c=>c.charCodeAt(0))},ck,ct);
            l.innerText=`[SUCCESS]\nMatrix: ${new TextDecoder().decode(dB)}`;l.style.color="#0f6";
            new Uint8Array(dB).fill(0);U.fill(0);km.fill(0);setTimeout(cl,4000);
        }else throw new Error();
    }catch(err){l.innerText="[ERROR] Verification pass failed.";l.style.color="#f36";U.fill(0);km.fill(0);}
};

const wc=E("wc"),cv=E("cv"),gl=cv.getContext("webgl2"),vs=`#version 300 es
in float idx;uniform float t;uniform vec2 m;uniform vec2 rot;out vec4 wColor;
void main(){
    float uID = float(gl_VertexID), x = (uID / 100000.0) * 6.2831853;
    float pR = cos(x * 3.0 - t * 1.5), pI = sin(x * 3.0 - t * 1.5), pD = (pR * pR) + (pI * pI);
    float velocity = x * 0.005, c_sq = 8.987551e10, l = 1.0 / sqrt(1.0 - min((velocity * velocity) / (c_sq * 1e-11), 0.99));
    float phi = x, th = acos(mix(-1.0, 1.0, fract(uID * 0.0007))), rD = 0.58 + (pR * 0.1 * pD * l);
    vec3 bP = vec3(sin(th)*cos(phi)*rD, sin(th)*sin(phi)*rD, cos(th)*rD*(1.0/l));
    float cY = cos(rot.x), sY = sin(rot.x), cP = cos(rot.y), sP = sin(rot.y);
    float rX = bP.x * cY - bP.z * sY, rZ = bP.x * sY + bP.z * cY, rY = bP.y * cP - rZ * sP;
    vec3 rP = vec3(rX, rY, rZ * cP + bP.y * sP);
    float dX = rP.x - m.x, dY = rP.y - m.y, dist = sqrt(dX * dX + dY * dY);
    if(dist < 0.35){rP.xy += (vec2(dX, dY) / dist) * (0.08 * (1.0 - dist / 0.35));}
    gl_Position = vec4(rP.xy * (1.0 / (2.0 - rP.z * 0.5)) * 1.3, 0.0, 1.0);
    gl_PointSize = mix(1.0, 2.5, (rP.z + 1.0) * 0.5);
    wColor = vec4(0.0, 0.5 + (pD * 0.3), 1.0, 0.8);
}`,fs=`#version 300 es
precision highp float;in vec4 wColor;out vec4 fc;void main(){fc=wColor;}`;
function cs(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const pg=gl.createProgram();gl.attachShader(pg,cs(gl.VERTEX_SHADER,vs));gl.attachShader(pg,cs(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pg);gl.useProgram(pg);
const corePoints=new Float32Array(10000);for(let i=0;i<10000;i++)corePoints[i]=i;
const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,corePoints,gl.STATIC_DRAW);
const pLoc=gl.getAttribLocation(pg,"idx");gl.enableVertexAttribArray(pLoc);gl.vertexAttribPointer(pLoc,1,gl.FLOAT,false,4,0);
const tLoc=gl.getUniformLocation(pg,"t"),mLoc=gl.getUniformLocation(pg,"m"),rotLoc=gl.getUniformLocation(pg,"rot");
let mx=-1000,my=-1000,rotX=0.6,rotY=0.4,isDragging=false,lastMouseX=0,lastMouseY=0;
function trackPointer(clientX, clientY) {
    const r=cv.getBoundingClientRect();mx=((clientX-r.left)/cv.width)*2.0-1.0;my=-(((clientY-r.top)/cv.height)*2.0-1.0);
}
wr.addEventListener("mousedown",(e)=>{isDragging=true;lastMouseX=e.clientX;lastMouseY=e.clientY;});
window.addEventListener("mouseup",()=>{isDragging=false;mx=-1000;my=-1000;});
wr.addEventListener("mousemove",(e)=>{
    if(isDragging){rotX += (e.clientX - lastMouseX) * 0.007;rotY += (e.clientY - lastMouseY) * 0.007;lastMouseX = e.clientX; lastMouseY = e.clientY;}else{trackPointer(e.clientX, e.clientY);}
});
wr.addEventListener("touchstart",(e)=>{if(e.touches.length===1){isDragging=true;lastMouseX=e.touches.clientX;lastMouseY=e.touches.clientY;}});
wr.addEventListener("touchmove",(e)=>{
    if(isDragging && e.touches.length===1){rotX += (e.touches.clientX - lastMouseX) * 0.007;rotY += (e.touches.clientY - lastMouseY) * 0.007;lastMouseX = e.touches.clientX; lastMouseY = e.touches.clientY;trackPointer(e.touches.clientX, e.touches.clientY);}
});
wr.addEventListener("touchend",()=>{isDragging=false;mx=-1000;my=-1000;});
function resize(){const dpr=window.devicePixelRatio||1;cv.width=wc.clientWidth*dpr;cv.height=wc.clientHeight*dpr;gl.viewport(0,0,cv.width,cv.height);}
window.addEventListener("resize",resize);resize();gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
setInterval(()=>{gl.clearColor(0.01,0.015,0.03,1.0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(tLoc,N()*0.0008);gl.uniform2f(mLoc,mx,my);gl.uniform2f(rotLoc,rotX,rotY);gl.drawArrays(gl.POINTS,0,100000);},16);
})();
</script></body></html>
