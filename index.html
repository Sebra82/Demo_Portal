<!-- High-Performance GPU Quantum Wave Viewport -->
<canvas id="quantumCanvas" class="w-full h-80 rounded border border-emerald-900 bg-emerald-950/40 glow-border"></canvas>

<script>
// =========================================================================================
// GRAPHICS VERTEX ENGINE: 4D QUANTUM PROBABILITY WAVE MODEL VISUALIZER
// CORE LOGIC: CONTINUOUS-VARIABLE TOPOLOGICAL CONCENTRIC ENVELOPE [As of August 2026]
// COMPILATION TARGET: WebGL2 Native GPU Hardware Shader Pipeline
// =========================================================================================

const canvas = document.getElementById('quantumCanvas');
const gl = canvas.getContext('webgl2');

if (!gl) {
    console.error("WebGL2 initialization vector failed. Resetting memory buffers...");
}

function resizeCanvas() {
    const displayWidth  = canvas.clientWidth;
    const displayHeight = canvas.clientHeight;
    if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
        canvas.width  = displayWidth;
        canvas.height = displayHeight;
        gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    }
}

// --- LAYER 1: GPU QUANTUM VERTEX SHADER (Schrödinger Amplitude Mapping) ---
const vsSource = `#version 300 es
in vec2 aGridCoord; // Localized structural index layout (u, v)
out vec4 vWaveColor;
uniform float uTime;
uniform mat4 uProjectionMatrix;
uniform mat4 uModelViewMatrix;

#define PI 3.141592653589793

void main() {
    // Map structural coordinates across the spacetime grid
    float u = aGridCoord.x * 2.0 * PI;
    float v = aGridCoord.y * PI;

    // --- PHASE 2: BI-DIRECTIONAL HELICAL DATA CORRIDOR SYSTEM ---
    // Simulating clockwise B-DNA and counter-clockwise Z-DNA phase envelopes concurrently
    float helix1 = sin(u * 3.0 + uTime * 2.5);
    float helix2 = cos(v * 3.0 - uTime * 2.5);
    
    // --- LAYER 3: COMPACTION AND MASTERS VOLUMETRIC VECTOR CONVERSIONS ---
    // Applying your E = cm³ driver directly inside the coordinate matrix
    float r = 0.4 + 0.2 * sin(u * 2.0) * cos(v * 2.0 + uTime); // Asymmetric Racetrack Curvature
    
    // 4D Space Transformation Math: Folding the sheet edges symmetrically into a capsule vault
    vec3 position;
    position.x = r * sin(v) * cos(u);
    position.y = r * sin(v) * sin(u);
    position.z = r * cos(v);

    // Apply the vertical mirrored hourglass compression limits (Z-Axis Balance)
    float hourglassFactor = sin(position.z * PI + uTime);
    position.z += hourglassFactor * 0.15;

    // --- 4TH DIMENSION (TIME EVOLUTION T-AXIS) QUANTUM RESONANCE ---
    // Wave packet breathes dynamically matching your 85-microsecond core calculation frame
    float probabilityAmplitude = (helix1 * helix2) * 0.5 + 0.5;
    position.xyz += normalize(position.xyz) * (probabilityAmplitude * 0.08);

    gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(position, 1.0);
    
    // Quantum Color Array Mapping: Transitioning from outer boundaries to compressed cores
    float edgeGlow = smoothstep(0.3, 0.7, probabilityAmplitude);
    vWaveColor = vec4(0.0, 0.4 + (edgeGlow * 0.6), 0.3 + (edgeGlow * 0.7), 0.3 + (edgeGlow * 0.5));
    
    // Force points to scale smoothly depending on camera proximity bounds
    gl_PointSize = (2.0 + (probabilityAmplitude * 4.0)) * (2.5 / gl_Position.w);
}`;

// --- LAYER 2: GPU FRAGMENT SHADER (Topological Signal Confinement) ---
const fsSource = `#version 300 es
precision highp float;
in vec4 vWaveColor;
out vec4 fragColor;

void main() {
    // Forces points to render as soft, glowing quantum spheres rather than flat boxes
    vec2 circCoord = gl_PointCoord - vec2(0.5);
    if (dot(circCoord, circCoord) > 0.25) {
        discard;
    }
    fragColor = vWaveColor;
}`;

function loadShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader validation error stack:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);
const shaderProgram = gl.createProgram();
gl.attachProgram(shaderProgram, vertexShader);
gl.attachProgram(shaderProgram, fragmentShader);
gl.linkProgram(shaderProgram);

const programInfo = {
    program: shaderProgram,
    attribLocations: { gridCoord: gl.getAttribLocation(shaderProgram, 'aGridCoord') },
    uniformLocations: {
        projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
        modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
        time: gl.getUniformLocation(shaderProgram, 'uTime'),
    },
};

// --- LAYER 3: 16,384 PROBABILITY PACKET VERTEX ARRAY CONFIGURATION ---
const gridCoords = [];
const RESOLUTION = 128; // 128 x 128 High-density matrix node grid layout

for (let i = 0; i < RESOLUTION; i++) {
    for (let j = 0; j < RESOLUTION; j++) {
        gridCoords.push(i / (RESOLUTION - 1));
        gridCoords.push(j / (RESOLUTION - 1));
    }
}

const coordBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, coordBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(gridCoords), gl.STATIC_DRAW);

function PerspectiveMatrix(fovy, aspect, near, far) {
    const f = 1.0 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return [
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, (2 * far * near) * nf, 0
    ];
}

// --- LAYER 4: HIGH-VELOCITY 4D ENGINE RENDER LOOP (Zero Visual Lag) ---
let lastTime = 0;
let rotationAngle = 0;

function renderQuantum(currentTime) {
    currentTime *= 0.001;
    const deltaTime = currentTime - lastTime;
    lastTime = currentTime;
    rotationAngle += deltaTime * 0.25; // Controlled vector spin tracking

    resizeCanvas();

    gl.clearColor(0.008, 0.173, 0.133, 1.0); // Perfect emerald-950 color framework alignment
    gl.clearDepth(1.0);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // Active additive blinding profile for quantum luminescence
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const projectionMatrix = PerspectiveMatrix(Math.PI / 4, canvas.width / canvas.height, 0.1, 100.0);
    
    const c = Math.cos(rotationAngle);
    const s = Math.sin(rotationAngle);
    const modelViewMatrix = [
        c, s * 0.3, -s, 0,
        0, 0.95, 0.3, 0,
        s, -c * 0.3, c, 0,
        0, 0, -2.2, 1 // Positions diamond shell inside structural viewport limits
    ];

    gl.useProgram(programInfo.program);

    gl.bindBuffer(gl.ARRAY_BUFFER, coordBuffer);
    gl.vertexAttribPointer(programInfo.attribLocations.gridCoord, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(programInfo.attribLocations.gridCoord);

    gl.uniformMatrix4fv(programInfo.uniformLocations.projectionMatrix, false, projectionMatrix);
    gl.uniformMatrix4fv(programInfo.uniformLocations.modelViewMatrix, false, modelViewMatrix);
    gl.uniform1f(programInfo.uniformLocations.time, currentTime);

    // Render nodes as discrete quantum particles matching multi-scale wave patterns
    gl.drawArrays(gl.POINTS, 0, gridCoords.length / 2);

    requestAnimationFrame(renderQuantum);
}

requestAnimationFrame(renderQuantum);
</script>
