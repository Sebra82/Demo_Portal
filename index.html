<!-- High-Performance WebGL2 Viewport Canvas -->
<canvas id="glCanvas" class="w-full h-80 rounded border border-emerald-900 bg-emerald-950/40 glow-border"></style></canvas>

<script>
// =========================================================================================
// ASSET REAL-TIME GRAPHICS ENGINE: 4D CONCENTRIC DIAMOND CAPSULE VISUALIZER
// COMPILATION TARGET: WebGL2 Native GPU Shader Pipeline [As of August 2026]
// =========================================================================================

const canvas = document.getElementById('glCanvas');
const gl = canvas.getContext('webgl2');

if (!gl) {
    console.error("WebGL2 context initialization failed. Upgrading execution environment defaults...");
}

// Ensure viewport dimensions match client hardware display limits precisely
function resizeCanvas() {
    const displayWidth  = canvas.clientWidth;
    const displayHeight = canvas.clientHeight;
    if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
        canvas.width  = displayWidth;
        canvas.height = displayHeight;
        gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
    }
}

// --- LAYER 1: GPU VERTEX SHADER SOURCE (Matrix Coordinate Transformation) ---
const vsSource = `#version 300 es
in vec4 aPosition;
in vec4 aColor;
out vec4 vColor;
uniform float uTime;
uniform mat4 uProjectionMatrix;
uniform mat4 uModelViewMatrix;

void main() {
    vec4 pos = aPosition;
    
    // --- THE 4TH DIMENSION (TIME EVOLUTION T-AXIS) MATRIX LAYERING ---
    // The dual-walled structure cycles through periodic spatial contractions like a quantum resonator
    float waveOffset = sin(uTime * 2.0 + pos.y * 3.0) * 0.08;
    
    // Apply breathing geometric offsets to the outer matrix vertex boundaries 
    if (pos.w > 0.5) { 
        pos.xyz += normalize(pos.xyz) * waveOffset;
    } else {
        // Phase-locked bi-directional tracking for internal core boundaries
        pos.xyz -= normalize(pos.xyz) * (waveOffset * 0.5);
    }
    
    gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(pos.xyz, 1.0);
    vColor = aColor;
}`;

// --- LAYER 2: GPU FRAGMENT SHADER SOURCE (Topological Wave Shading) ---
const fsSource = `#version 300 es
precision highp float;
in vec4 vColor;
out vec4 fragColor;

void main() {
    // Renders the glowing cryptographic vault boundaries in native emerald profiles
    fragColor = vColor;
}`;

// Helper routine to compile raw shader strings into active GPU program assets
function loadShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader compilation error logs:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
    }
    return shader;
}

const vertexShader = loadShader(gl, gl.VERTEX_SHADER, vsSource);
const fragmentShader = loadShader(gl, gl.FRAGMENT_SHADER, fsSource);
const shaderProgram = gl.createProgram();
gl.attachShader(shaderProgram, vertexShader);
gl.attachShader(shaderProgram, fragmentShader);
gl.linkProgram(shaderProgram);

const programInfo = {
    program: shaderProgram,
    attribLocations: {
        position: gl.getAttribLocation(shaderProgram, 'aPosition'),
        color: gl.getAttribLocation(shaderProgram, 'aColor'),
    },
    uniformLocations: {
        projectionMatrix: gl.getUniformLocation(shaderProgram, 'uProjectionMatrix'),
        modelViewMatrix: gl.getUniformLocation(shaderProgram, 'uModelViewMatrix'),
        time: gl.getUniformLocation(shaderProgram, 'uTime'),
    },
};

// --- LAYER 3: 3D MATRIX MODEL GEOMETRY ASSEMBLY (Concentric Diamond Shells) ---
// Builds vertices for two nested double-pyramids (Outer Shell vs Inner Racetrack Core)
const vertices = [];
const colors = [];

function generateDiamond(scale, isOuter) {
    // 6 Spatial Vertex Core Anchors
    const top    = [0.0,  scale, 0.0, isOuter ? 1.0 : 0.0];
    const bottom = [0.0, -scale, 0.0, isOuter ? 1.0 : 0.0];
    const left   = [-scale, 0.0,  scale, isOuter ? 1.0 : 0.0];
    const right  = [ scale, 0.0,  scale, isOuter ? 1.0 : 0.0];
    const back   = [ scale, 0.0, -scale, isOuter ? 1.0 : 0.0];
    const front  = [-scale, 0.0, -scale, isOuter ? 1.0 : 0.0];

    const emeraldGreen = isOuter ? [0.06, 0.73, 0.51, 0.4] : [0.2, 0.83, 0.6, 0.9];

    function addTriangle(p1, p2, p3) {
        vertices.push(...p1, ...p2, ...p3);
        colors.push(...emeraldGreen, ...emeraldGreen, ...emeraldGreen);
    }

    // Top Pyramid Faces
    addTriangle(top, left, right);  addTriangle(top, right, back);
    addTriangle(top, back, front);  addTriangle(top, front, left);
    // Bottom Pyramid Faces
    addTriangle(bottom, right, left); addTriangle(bottom, back, right);
    addTriangle(bottom, front, back); addTriangle(bottom, left, front);
}

generateDiamond(0.8, true);  // Outer Capsule Relativistic Boundary Wall
generateDiamond(0.4, false); // Inner Concentric Wave Compaction Core Layer

const positionBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

const colorBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

// Matrix mathematical helpers for real-time 3D coordinate projection operations
function PerspectiveMatrix(fovy, aspect, near, far) {
    const f = 1.0 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return [
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, (2 * far * near) * nf, 0
    ];
}

// --- LAYER 4: REAL-TIME GRAPHICS EXECUTION LOOP (Sub-3ms UI Fluidity) ---
let lastTime = 0;
let rotationAngle = 0;

function render(currentTime) {
    currentTime *= 0.001; // Convert to seconds
    const deltaTime = currentTime - lastTime;
    lastTime = currentTime;
    rotationAngle += deltaTime * 0.4; // Controlled rotation velocity tracking

    resizeCanvas();

    gl.clearColor(0.008, 0.173, 0.133, 1.0); // Perfect emerald-950 backend blending profile
    gl.clearDepth(1.0);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); // Enables fluid structural transparencies
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const projectionMatrix = PerspectiveMatrix(Math.PI / 4, canvas.width / canvas.height, 0.1, 100.0);
    
    // Rotate model coordinates dynamically to display all four dimensional faces
    const c = Math.cos(rotationAngle);
    const s = Math.sin(rotationAngle);
    const modelViewMatrix = [
        c, 0, -s, 0,
        0, 1,  0, 0,
        s, 0,  c, 0,
        0, 0, -2.5, 1 // Move capsule back along Z-axis into viewing frame
    ];

    gl.useProgram(programInfo.program);

    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.vertexAttribPointer(programInfo.attribLocations.position, 4, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(programInfo.attribLocations.position);

    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
    gl.vertexAttribPointer(programInfo.attribLocations.color, 4, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(programInfo.attribLocations.color);

    gl.uniformMatrix4fv(programInfo.uniformLocations.projectionMatrix, false, projectionMatrix);
    gl.uniformMatrix4fv(programInfo.uniformLocations.modelViewMatrix, false, modelViewMatrix);
    gl.uniform1f(programInfo.uniformLocations.time, currentTime);

    // Renders vertices as wireframe paths to display the structural B/Z-DNA corridors explicitly
    gl.drawArrays(gl.LINES, 0, vertices.length / 4);

    requestAnimationFrame(render);
}

// Initialise the native animation loop
requestAnimationFrame(render);
</script>
