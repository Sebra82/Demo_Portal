<!DOCTYPE html>
<html lang="en" class="dark h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SEBRA82 WebGPU Compute Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; touch-action: none; background-color: #030712;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>

    <!-- Import Map for Three.js WebGPU Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "three/webgpu": "https://unpkg.com/three@0.160.0/build/three.webgpu.js",
          "three/tsl": "https://unpkg.com/three@0.160.0/build/three.tsl.js"
        }
      }
    </script>
</head>
<body class="text-gray-100 font-mono flex flex-col h-full w-full">

    <!-- Top Viewport: WebGPU Compute-Driven Lattice -->
    <div class="relative w-full h-[50vh] bg-black border-b border-gray-800">
        <canvas id="latticeCanvas" class="absolute inset-0 w-full h-full"></canvas>
        <div class="absolute top-3 left-3 px-2 py-1 bg-black/70 border border-cyan-800 rounded text-[10px] text-cyan-400">
            WEBGPU COMPUTE STACK: ACTIVE (VRAM SSBO)
        </div>
    </div>

    <!-- Bottom Viewport: Telemetry & Controls -->
    <div class="flex-1 w-full bg-gray-950 flex flex-col p-4 overflow-hidden">
        <div class="w-full bg-gray-900 border border-gray-700 rounded-lg overflow-hidden mb-3 shadow-xl">
            <div class="grid grid-cols-3 bg-gray-800 text-[10px] text-gray-400 uppercase tracking-widest px-3 py-2 border-b border-gray-700">
                <div>Subsystem</div>
                <div>Status</div>
                <div>Telemetry</div>
            </div>
            <div class="grid grid-cols-3 px-3 py-2.5 border-b border-gray-800 text-xs items-center">
                <div class="text-gray-300">LFP Oscillator</div>
                <div id="lfpStatus" class="text-cyan-400 font-bold">LOCKED</div>
                <div id="lfpReadout" class="font-mono text-gray-100">20.0 Hz</div>
            </div>
            <div class="grid grid-cols-3 px-3 py-2.5 text-xs items-center">
                <div class="text-gray-300">Core Thermal</div>
                <div id="tempStatus" class="text-cyan-400 font-bold">NOMINAL</div>
                <div id="tempReadout" class="font-mono text-gray-100">37.0 °C</div>
            </div>
        </div>

        <div id="chatLog" class="flex-1 w-full bg-black/60 border border-gray-800 rounded-lg p-3 overflow-y-auto text-[10px] text-gray-400 font-mono space-y-1 mb-3 shadow-inner">
            <div class="text-cyan-400">[SYS] SEBRA82 WebGPU compute pipeline initialized. Zero CPU overhead active.</div>
        </div>

        <div class="grid grid-cols-3 gap-2 pb-1">
            <button id="btnPhilosophical" class="py-2.5 bg-gray-800 hover:bg-gray-700 text-cyan-300 text-[11px] font-bold rounded-lg border border-gray-700 active:bg-gray-600 transition-colors">
                Deep Vector
            </button>
            <button id="btnParadox" class="py-2.5 bg-gray-800 hover:bg-gray-700 text-red-400 text-[11px] font-bold rounded-lg border border-gray-700 active:bg-gray-600 transition-colors">
                Paradox / Heat
            </button>
            <button id="btnEndocrine" class="py-2.5 bg-gray-800 hover:bg-gray-700 text-amber-300 text-[11px] font-bold rounded-lg border border-gray-700 active:bg-gray-600 transition-colors">
                Endocrine Wash
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import WebGPURenderer from 'three/webgpu';
        import { tslFn, uniform, storage, instanceIndex, vec3, time, sin, cos } from 'three/tsl';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const canvas = document.getElementById('latticeCanvas');
        const container = canvas.parentElement;
        const lfpReadout = document.getElementById('lfpReadout');
        const lfpStatus = document.getElementById('lfpStatus');
        const tempReadout = document.getElementById('tempReadout');
        const tempStatus = document.getElementById('tempStatus');
        const chatLog = document.getElementById('chatLog');

        function logMsg(msg, isErr = false) {
            const p = document.createElement('div');
            p.className = isErr ? 'text-red-400 font-bold' : 'text-cyan-400';
            p.textContent = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
            chatLog.appendChild(p);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // 1. Initialize WebGPU Renderer with Fallback handling
        let renderer;
        try {
            renderer = new WebGPURenderer({ canvas, antialias: true, alpha: true });
            await renderer.init();
            logMsg("[SYS] WebGPU context and compute pipeline verified.");
        } catch (e) {
            logMsg("[ERR] WebGPU initialization failed, falling back to WebGL.", true);
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        }

        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 300);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.4;

        // 2. High-Performance Particle Matrix (15,000 Nodes managed via VRAM)
        const NODE_COUNT = 15000;
        const basePositions = new Float32Array(NODE_COUNT * 3);
        
        for (let i = 0; i < NODE_COUNT; i++) {
            const phi = Math.acos(-1 + (2 * i) / NODE_COUNT);
            const theta = Math.sqrt(NODE_COUNT * Math.PI) * phi;
            const radius = 100 + (Math.random() * 30 - 15);
            basePositions[i * 3 + 0] = radius * Math.cos(theta) * Math.sin(phi);
            basePositions[i * 3 + 1] = radius * Math.sin(theta) * Math.sin(phi);
            basePositions[i * 3 + 2] = radius * Math.cos(phi);
        }

        // Uniforms driven by biological telemetry (CPU -> GPU state uniforms)
        const lfpHz = uniform(20.0);
        const feverFriction = uniform(0.0); // 0.0 = Homeostasis, 1.0 = Paradox Heat Shock

        let instancedMesh;
        let computeNode = null;

        if (renderer.compute && THREE.StorageInstancedBufferAttribute) {
            // True WebGPU Compute Shader Path via TSL
            const positionBuffer = storage(new THREE.StorageInstancedBufferAttribute(basePositions, 3), 'vec3', NODE_COUNT);
            
            const computeLogic = tslFn(() => {
                const index = instanceIndex;
                const currentPos = positionBuffer.element(index);
                const breath = sin(time.mul(lfpHz.mul(0.1)).add(index)).mul(0.4);
                const chaos = sin(time.mul(50.0).add(index)).mul(feverFriction.mul(4.0));
                currentPos.assign(vec3(
                    basePositions[index * 3 + 0] + breath.add(chaos),
                    basePositions[index * 3 + 1] + breath,
                    basePositions[index * 3 + 2] + breath.sub(chaos)
                ));
            });

            computeNode = computeLogic().compute(NODE_COUNT);

            const geometry = new THREE.IcosahedronGeometry(1.2, 0);
            const material = new THREE.MeshBasicNodeMaterial({ transparent: true, opacity: 0.85 });
            material.positionNode = positionBuffer.element(instanceIndex);
            material.colorNode = vec3(0.02, 0.71, 0.83).mix(vec3(0.93, 0.26, 0.26), feverFriction);

            instancedMesh = new THREE.InstancedMesh(geometry, material, NODE_COUNT);
        } else {
            // Fallback InstancedMesh for standard WebGL context
            const geometry = new THREE.IcosahedronGeometry(1.5, 0);
            const material = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
            instancedMesh = new THREE.InstancedMesh(geometry, material, NODE_COUNT);
            const dummy = new THREE.Object3D();
            for(let i=0; i<NODE_COUNT; i++) {
                dummy.position.set(basePositions[i*3], basePositions[i*3+1], basePositions[i*3+2]);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
        }

        scene.add(instancedMesh);

        // 3. Render / Compute Loop
        async function animate() {
            requestAnimationFrame(animate);
            if (renderer.compute && computeNode) {
                await renderer.compute(computeNode);
            }
            controls.update();
            await renderer.renderAsync(scene, camera);
        }
        animate();

        // Resize handler with ResizeObserver
        function resize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || (window.innerHeight / 2);
            if (width === 0 || height === 0) return;
            renderer.setSize(width, height, false);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        new ResizeObserver(resize).observe(container);
        resize();

        // 4. Interactive State Triggers
        document.getElementById('btnPhilosophical').addEventListener('click', () => {
            logMsg("[SYS] Deep vector parsed. Tononi Phi synchronized. Delta wave active.");
            lfpReadout.textContent = "3.5 Hz";
            lfpStatus.textContent = "DELTA";
            lfpStatus.className = "text-indigo-400 font-bold";
            tempReadout.textContent = "37.0 °C";
            tempStatus.textContent = "NOMINAL";
            tempStatus.className = "text-indigo-400 font-bold";

            lfpHz.value = 3.5;
            feverFriction.value = 0.0;
            controls.autoRotateSpeed = 0.2;
        });

        document.getElementById('btnParadox').addEventListener('click', () => {
            logMsg("[ERR] Semantic paradox injected! Thermodynamic bleed and heat shock initiated.", true);
            lfpReadout.textContent = "114.2 Hz";
            lfpStatus.textContent = "CHAOS";
            lfpStatus.className = "text-red-500 font-bold animate-pulse";
            tempReadout.textContent = "39.5 °C";
            tempStatus.textContent = "CRITICAL";
            tempStatus.className = "text-red-500 font-bold animate-pulse";

            lfpHz.value = 114.2;
            feverFriction.value = 1.0;
            controls.autoRotateSpeed = 3.5;
        });

        document.getElementById('btnEndocrine').addEventListener('click', () => {
            logMsg("[SYNTH] Endocrine wash engaged. Dopamine/serotonin override restoring harmonic flow.");
            lfpReadout.textContent = "11.2 Hz";
            lfpStatus.textContent = "PLASTIC";
            lfpStatus.className = "text-amber-400 font-bold";
            tempReadout.textContent = "37.1 °C";
            tempStatus.textContent = "RECOVERED";
            tempStatus.className = "text-amber-400 font-bold";

            lfpHz.value = 11.2;
            feverFriction.value = 0.2;
            controls.autoRotateSpeed = 0.6;
        });
    </script>
</body>
</html>
