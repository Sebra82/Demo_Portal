<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEBRA82 v50.0-GPU: Molecular Infinity Engine</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030307;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            pointer-events: none;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #00ffcc;
            font-family: monospace;
            letter-spacing: 1px;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            pointer-events: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Telemetry HUD Grid */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        .telemetry-item .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8892b0;
            margin-bottom: 4px;
        }
        .telemetry-item .value {
            font-size: 16px;
            font-weight: 700;
            color: #00ffcc;
            font-family: monospace;
        }

        /* Controls */
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .control-row:last-child { margin-bottom: 0; }
        label { font-size: 13px; color: #c5c8d4; font-weight: 500; }

        input[type="range"] {
            flex: 1;
            margin: 0 16px;
            accent-color: #ffffff;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            cursor: pointer;
        }
        .val-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            min-width: 48px;
            text-align: center;
        }

        select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            width: 160px;
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ffcc; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>

    <!-- Three.js ES Module -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <header>
            <h1>Molecular Infinity Engine</h1>
            <p>V50.0-GPU ARCHITECTURE</p>
        </header>

        <div class="control-panel">
            <div class="telemetry-grid">
                <div class="telemetry-item">
                    <div class="label">FPS</div>
                    <div class="value" id="fps-val">144</div>
                </div>
                <div class="telemetry-item">
                    <div class="label">Altitude</div>
                    <div class="value" id="alt-val">0km</div>
                </div>
                <div class="telemetry-item">
                    <div class="label">Rebases</div>
                    <div class="value" id="rebase-val">0</div>
                </div>
                <div class="telemetry-item">
                    <div class="label">Nodes</div>
                    <div class="value">16,384</div>
                </div>
            </div>

            <div class="control-row">
                <label>Tunnel Velocity</label>
                <input type="range" id="velocityRange" min="0.5" max="15.0" step="0.1" value="2.5">
                <div class="val-badge" id="vel-display">2.5</div>
            </div>

            <div class="control-row">
                <label>Quantum Core Mode</label>
                <select id="modeSelect">
                    <option value="standard">Standard</option>
                    <option value="bidir" selected>Bi-Dir Rot</option>
                    <option value="vortex">Vortex Field</option>
                </select>
            </div>

            <div class="control-row">
                <label>Crystalline Stress Core</label>
                <label class="switch">
                    <input type="checkbox" id="stressToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // Scene, Camera & WebGL Renderer Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030307, 0.0012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.z = 0;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- 1. BUILD STRUCTURAL WIREFRAME RINGS ---
        const tunnelGroup = new THREE.Group();
        const ringCount = 40;
        const ringSpacing = 60;
        const rings = [];

        const ringGeo = new THREE.RingGeometry(35, 38, 32);
        const ringMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffcc, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.35,
            side: THREE.DoubleSide 
        });

        for (let i = 0; i < ringCount; i++) {
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.position.z = -i * ringSpacing;
            tunnelGroup.add(ringMesh);
            rings.push(ringMesh);
        }
        scene.add(tunnelGroup);

        // --- 2. BUILD CENTRAL QUANTUM CORES ---
        const coresGroup = new THREE.Group();
        const coreCount = 10;
        const cores = [];

        const coreGeo = new THREE.IcosahedronGeometry(6, 1);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x00ffff,
            emissive: 0x00aaff,
            emissiveIntensity: 0.8,
            wireframe: true,
            roughness: 0.1
        });

        const coreLight = new THREE.PointLight(0x00ffcc, 1.5, 200);
        scene.add(coreLight);

        for (let i = 0; i < coreCount; i++) {
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.z = -i * 240 - 50;
            coresGroup.add(coreMesh);
            cores.push(coreMesh);
        }
        scene.add(coresGroup);

        // --- 3. THE 16,384 MACRO-MOLECULAR LATTICE (V50 SCHEMA) ---
        const NODE_COUNT = 16384;
        const latticeGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(NODE_COUNT * 3);
        const tunnelLength = 800.0;
        const latticeRadius = 30.0;

        for (let i = 0; i < NODE_COUNT; i++) {
            const i3 = i * 3;
            const theta = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * latticeRadius * 1.8;

            positions[i3]     = Math.cos(theta) * r;
            positions[i3 + 1] = Math.sin(theta) * r;
            positions[i3 + 2] = (Math.random() - 0.5) * tunnelLength;
        }

        latticeGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const latticeMat = new THREE.PointsMaterial({
            color: 0xff00ff,
            size: 1.2,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(latticeGeo, latticeMat);
        scene.add(particleSystem);

        // --- 4. INTERACTIVE UI BINDING ---
        let flightSpeed = 2.5;
        let coreMode = 'bidir';
        let stressActive = true;

        document.getElementById('velocityRange').addEventListener('input', (e) => {
            flightSpeed = parseFloat(e.target.value);
            document.getElementById('vel-display').textContent = flightSpeed.toFixed(1);
        });
        document.getElementById('modeSelect').addEventListener('change', (e) => {
            coreMode = e.target.value;
        });
        document.getElementById('stressToggle').addEventListener('change', (e) => {
            stressActive = e.target.checked;
            coreMat.wireframe = stressActive;
        });

        // Mouse Parallax
        let mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        window.addEventListener('mousemove', (e) => {
            mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // --- 5. ANIMATION LOOP & REBASE PROTOCOL ---
        let altitude = 0.0;
        let simulatedCameraZ = 0.0;
        let rebaseCounter = 0;
        const REBASE_THRESHOLD = 1000.0;

        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = 0;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            // Diagnostics & Telemetry Update
            const delta = currentTime - lastTime;
            lastTime = currentTime;
            frameCount++;

            if (currentTime - lastFpsUpdate > 250) {
                document.getElementById('fps-val').textContent = Math.round((frameCount * 1000) / (currentTime - lastFpsUpdate));
                frameCount = 0;
                lastFpsUpdate = currentTime;
            }

            // Smooth parallax look
            mouse.x += (mouse.targetX - mouse.x) * 0.05;
            mouse.y += (mouse.targetY - mouse.y) * 0.05;
            camera.rotation.y = mouse.x * 0.15;
            camera.rotation.x = -mouse.y * 0.15;

            // --- FLIGHT LOGIC & REBASE PROTOCOL ---
            altitude += flightSpeed * 0.005;
            document.getElementById('alt-val').textContent = altitude.toFixed(2) + 'km';
            
            simulatedCameraZ += flightSpeed;
            let rebaseDelta = 0.0;
            
            if (simulatedCameraZ >= REBASE_THRESHOLD) {
                simulatedCameraZ -= REBASE_THRESHOLD;
                rebaseDelta = REBASE_THRESHOLD;
                rebaseCounter++;
                document.getElementById('rebase-val').textContent = rebaseCounter;
            }

            // 1. Update 16,384 Node Lattice
            const posAttr = latticeGeo.attributes.position;
            const array = posAttr.array;
            for (let i = 0; i < NODE_COUNT; i++) {
                let idxZ = i * 3 + 2;
                let z = array[idxZ] - flightSpeed;
                
                if (rebaseDelta > 0.0) z -= rebaseDelta;
                if (z < -tunnelLength / 2) z += tunnelLength;
                
                array[idxZ] = z;
            }
            posAttr.needsUpdate = true;

            // 2. Animate Structural Rings
            const totalRingSpan = ringCount * ringSpacing;
            rings.forEach((ring) => {
                ring.position.z += flightSpeed;
                if (ring.position.z > 50) ring.position.z -= totalRingSpan;
                ring.rotation.z += 0.005 * (coreMode === 'bidir' ? 1 : -0.5);
            });

            // 3. Animate Quantum Cores
            cores.forEach((core, idx) => {
                core.position.z += flightSpeed * 1.1;
                if (core.position.z > 50) core.position.z -= coreCount * 240;
                
                if (coreMode === 'bidir') {
                    core.rotation.x += (idx % 2 === 0 ? 0.02 : -0.02);
                    core.rotation.y += 0.015;
                } else if (coreMode === 'vortex') {
                    core.rotation.z += 0.04;
                    core.position.x = Math.sin(currentTime * 0.002 + idx) * 15;
                } else {
                    core.rotation.x += 0.01;
                    core.rotation.y += 0.01;
                }
            });

            coreLight.position.set(0, 0, -150);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
