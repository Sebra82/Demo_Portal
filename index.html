<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SEB QUANTUM OPERATIONS CONSOLE</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
<div class="console-container" role="main">
    <header><div class="title-block"><div class="main-title">⚡ SEB QUANTUM OPERATION SYSTEM</div></div><div class="status-badge" id="st">ENCLAVE_LOCKED</div></header>
    <div class="metrics-grid"><div class="telemetry-card"><div class="card-label">Latency</div><div class="card-value" id="la">0.92411 ns</div></div></div>
    <div class="viewport-frame" id="wc"><canvas id="cv"></canvas></div>
    <div class="control-panel">
        <div class="license-selector"><div class="license-card active" id="t1" onclick="st('saas',50000)">SaaS Fleet</div><div class="license-card" id="t2" onclick="st('flat',157600)">Node Core</div></div>
        <button class="action-btn" onclick="op()">Initialize</button>
    </div>
</div>
<div class="modal-overlay" id="vm"><div class="modal-box"><div class="modal-log" id="lo">Auth required...</div><input type="password" id="pw"><button class="action-btn" onclick="hv()">RESOLVE</button></div></div>
<script src="app.js"></script>
</body>
</html>
