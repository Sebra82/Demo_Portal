<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M4 4D</title><style>
:root{--g:#0f6;--c:#0f_f;--r:#f36;}*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:monospace;font-size:10px;}
body{background:#06080b;color:#fff;padding:8px;display:flex;justify-content:center;}
.d{width:100%;max-width:900px;display:flex;flex-direction:column;gap:5px;}
header{border-bottom:1px solid #121824;padding-bottom:4px;display:flex;justify-content:space-between;color:var(--c);}
.m{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid #121824;padding:6px;background:#0b0e14;}
.w{width:100%;height:220px;background:#000;border:1px solid #121824;border-radius:3px;position:relative;}
canvas{width:100%;height:100%;display:block;}
.s{border:1px solid var(--c);padding:8px;background:#080c12;display:flex;flex-direction:column;gap:5px;}
.c{border:1px solid #121824;background:#05070a;padding:6px;cursor:pointer;}
.c.a{border-color:var(--g);box-shadow:0 0 8px rgba(0,255,102,.2);}
button{background:transparent;border:1px solid var(--g);color:var(--g);padding:5px;cursor:pointer;width:100%;font-weight:bold;text-transform:uppercase;}
.v{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(3,4,6,.95);z-index:9;align-items:center;justify-content:center;}
.f{background:#090d16;border:1px solid var(--c);padding:15px;width:340px;}
.l{background:#000;border:1px solid #121824;padding:6px;height:55px;overflow-y:auto;font-size:9px;color:#4e5e78;margin-bottom:6px;white-space:pre-wrap;}
input{width:100%;background:#020407;border:1px solid #121824;color:var(--g);padding:5px;font-family:inherit;margin-bottom:8px;outline:none;}
.b{display:flex;gap:5px;}.b button{flex:1;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
</style></head><body>
<div class="d" role="main">
    <header><div>⚡ SEB QUANTUM SYSTEM CORE v5.20</div><div id="st">LOCKED</div></header>
    <div class="m">
        <div>LATENCY: <span id="la" style="color:var(--c)">3.50035</span> ns</div>
        <div>VELOCITY: <span id="th" style="color:var(--c)">285M</span> op/s</div>
    </div>
    <div class="w" id="wc"><canvas id="cv"></canvas></div>
    <div class="s">
        <div class="c a" id="t1" onclick="st('saas',50000)"><b>Online SaaS Node Contract</b><div style="color:var(--c)">£50,000/mo</div></div>
        <div class="c" id="t2" onclick="st('flat',157600)"><b>B2B On-Premise Core DLL</b><div style="color:var(--g)">£157,600 flat fee</div></div>
        <button onclick="op()">Initialize Procurement Pipeline</button>
    </div>
</div>
<div class="v" id="vm">
    <div class="f" role="dialog" aria-modal="true">
        <div class="l" id="lo">Awaiting token validation...</div>
        <input type="password" id="pw" placeholder="Enter key signature..." aria-label="Passphrase Token">
        <div class="b">
            <button style="border-color:var(--r);color:var(--r);" onclick="cl()">CANCEL</button>
            <button onclick="hv()">AUTHORIZE SETTLEMENT</button>
        </div>
    </div>
</div>
<div id="ax" class="sr-only" aria-live="assertive">4D Tesseract Simulation environment operational via WebGL2.</div>
<script>
const TARGET="e929eb14dda6dc481466fec08eda49836c0982a939b7e44a2fc5665013c5627a";
let tier="saas",cost=50000,mX=-1000,mY=-1000,rotX=0,rotY=0,drag=!1,sMX,sMY,time=0;
setInterval(()=>{try{(function(){return!1;})['constructor']("debugger")();}catch(e){}},100);
const wb=new Blob([`setInterval(()=>{try{(function(){return!1;})['constructor']("debugger")();}catch(e){}},100);self.onmessage=async function(e){const{p,t}=e.data;try{const encoder=new TextEncoder();let b=encoder.encode(p);for(let i=0; i<1000; i++)b=new Uint8Array(await crypto.subtle.digest("SHA-256",b));const fb=await crypto.subtle.digest("SHA-256",encoder.encode(p));const hex=Array.from(new Uint8Array(fb)).map(x=>x.toString(16).padStart(2,'0')).join('');self.postMessage({s:hex===t});}catch(err){self.postMessage({s:!1});}};`],{type:"text/javascript"}),cw=new Worker(URL.createObjectURL(wb));
setInterval(()=>{document.getElementById("la").innerText=(3.50035+(Math.random()*0.002-0.001)).toFixed(5);document.getElementById("th").innerText=(285000000+Math.floor(Math.random()*4000-2000)).toLocaleString();},1000);
function st(t,c){tier=t;cost=c;document.getElementById("t1").className="c"+(t==="saas"?" a":"");document.getElementById("t2").className="c"+(t==="flat"?" a":"");}
function op(){document.getElementById("vm").style.display="flex";document.getElementById("lo").innerText=`TRANSACTION TOTAL: £\    ${cost.toLocaleString()}\\nAwaiting verification token pass...`;}
function cl(){document.getElementById("vm").style.display="none";document.getElementById("pw").value="";}
function hv(){const v=document.getElementById("pw").value.toLowerCase().trim();if(!v)return;document.getElementById("lo").innerText="Stretching key matrices...";cw.postMessage({p:v,t:TARGET});}
cw.onmessage=function(e){const l=document.getElementById("lo");if(e.data.s){l.innerText=`[SUCCESS] Fulfillment Authorized.\\nLicense Issued: \${tier.toUpperCase()}`;l.style.color="#0f6";document.getElementById("st").innerText="UNLOCKED";document.getElementById("st").style.color="#0f6";setTimeout(cl,3000);}else{l.innerText="[ERROR] Token Signature Validation Failed.";l.style.color="#f36";document.getElementById("pw").value="";}};
const wc=document.getElementById("wc"),cv=document.getElementById("cv"),gl=cv.getContext("webgl2");
const vs=`#version 300 es
in vec2 p;uniform vec2 r;uniform float t;uniform vec2 ro;uniform vec2 m;uniform float s;out float vt;void main(){
    vec2 uv=p;float a=uv.x*6.2831853;float wScale=cos(t*0.015)*sin(t*0.030);float rad=(uv.y*3.2+1.5)+(wScale*uv.x*0.4);vt=step(0.5,uv.y);
    float x4d=cos(a)*rad;float y4d=sin(a)*rad;float z4d=sin(a*2.0)*rad*0.5;float w4d=cos(a*2.0)*rad*0.5+t*0.5;
    float factor=1.0/(3.5-cos(wScale)*w4d);vec3 pos=vec3(x4d,y4d,z4d)*factor;
    float cX=cos(ro.x),sX=sin(ro.x),cY=cos(ro.y),sY=sin(ro.y);float rY=pos.y*cX-pos.z*sX,rZ=pos.y*sX+pos.z*cX,rX=pos.x*cY-rZ*sY;
    vec2 pr=vec2(rX,rY)*110.0+(r/2.0);float d=distance(pr,m);if(d<28.0)pr+=normalize(pr-m)*((28.0-d)/28.0)*10.0;
    gl_Position=vec4((((pr/r)*2.0)-1.0)*vec2(1.0,-1.0),0.0,1.0);gl_PointSize=1.5;
}`;
const fs=`#version 300 es
precision highp float;in float vt;out vec4 fc;void main(){fc=vt>0.5?vec4(1.0,0.2,0.4,0.4):vec4(0.0,0.94,1.0,0.5);}`;
function cs(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const pg=gl.createProgram();gl.attachShader(pg,cs(gl.VERTEX_SHADER,vs));gl.attachShader(pg,cs(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pg);
const vD=new Float32Array(1000);for(let i=0;i<500;i++){vD[i*2]=i/500;vD[i*2+1]=(i%3)/3.0;}
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,vD,gl.STATIC_DRAW);
const pa=gl.getAttribLocation(pg,"p"),ru=gl.getUniformLocation(pg,"r"),tu=gl.getUniformLocation(pg,"t"),rou=gl.getUniformLocation(pg,"ro"),mu=gl.getUniformLocation(pg,"m"),su=gl.getUniformLocation(pg,"s");
function loop(){time+=0.005;const dpr=window.devicePixelRatio||1;cv.width=wc.clientWidth*dpr;cv.height=wc.clientHeight*dpr;gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0.015,0.023,0.035,1.0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(pg);gl.enableVertexAttribArray(pa);gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.vertexAttribPointer(pa,2,gl.FLOAT,!1,0,0);gl.uniform2f(ru,cv.width/dpr,cv.height/dpr);gl.uniform1f(tu,time);gl.uniform2f(rou,rotX,rotY);gl.uniform2f(mu,mX,mY);gl.uniform1f(su,tier==="saas"?1.0:2.5);gl.drawArrays(gl.POINTS,0,500);requestAnimationFrame(loop);}
wc.addEventListener("mousedown",e=>{drag=!0;sMX=e.clientX;sMY=e.clientY;});
window.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();mX=e.clientX-r.left;mY=e.clientY-r.top;if(!drag)return;rotY+=(e.clientX-sMX)*0.004;rotX+=(e.clientY-sMY)*0.004;sMX=e.clientX;sMY=e.clientY;});
window.addEventListener("mouseup",()=>{drag=!1;});wc.addEventListener("mouseleave",()=>{mX=-1000;mY=-1000;});
wc.addEventListener("touchstart",e=>{if(e.touches.length===1){drag=!0;const r=cv.getBoundingClientRect();sMX=e.touches.clientX;sMY=e.touches.clientY;mX=sMX-r.left;mY=sMY-r.top;}});
wc.addEventListener("touchmove",e=>{if(e.touches.length===1){const r=cv.getBoundingClientRect();mX=e.touches.clientX-r.left;mY=e.touches.clientY-r.top;if(!drag)return;rotY+=(e.touches.clientX-sMX)*0.004;rotX+=(e.touches.clientY-sMY)*0.004;sMX=e.touches.clientX;sMY=e.touches.clientY;}});
wc.addEventListener("touchend",()=>{drag=!1;mX=-1000;mY=-1000;});
requestAnimationFrame(loop);
</script></body></html>
