<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M4</title><style>

</style></head><body>
<div class="c">
    <div class="h"><div>M4P-V6.99_ACTIVE_LINE_MATRIX</div><div class="b" id="b">ENC_LOCKED</div></div>
    <div class="w" id="wr"><canvas id="cv"></canvas></div>
    <div class="p a"><div class="ph"><span>SYS_VAULT_GATEWAY // CORE_VALIDATOR</span><span class="ps" id="gs">[VAULT STATUS] Locked. Enter key.</span></div>
    <div class="g"><input type="password" id="gk" placeholder="AUTH..."><button onclick="A()">ENTER</button></div></div>
    <div class="g-grid" id="dg"><table><thead><tr><th>Offset</th><th>Secret Payload</th><th>State</th></tr></thead><tbody id="tb"></tbody></table></div>
    <div id="q"></div>
</div>
<script>
(function(){
const _X={'A':"-",'B':"--",'C':"---",'E':"-----",'J':"----------",'Z':"----------------------------------------------------------------------------------------------------"};
const _L1=_X['A'].length,_L2=_X['B'].length,_L5=_X['E'].length,_L100=_X['Z'].length,SafeNow=window.performance.now.bind(window.performance),SafeCrypto=window.crypto.subtle;
const CIPHERTEXT_B64="U01BUlRMRURHRVJTVFJJREVCT05EU0VDVVJFQ09SRTk5NVBMVVM=",IV_B64="NTRXRTNSRDRGNkc3",KEY_ROUTER_URL="https://github.io",TARGET="e929eb14dda6dc481466fec08eda49836c0982a939b7e44a2fc5665013c5627a";

// 🛑 INTERLOCKING ANTI-DEBUGGER WATCHDOG
setInterval(()=>{const s=SafeNow();try{(function(){return!1;})['constructor']("debugger")();}catch(e){}if(SafeNow()-s>22)while(!1){}},30);

// 🛠️ COMPRESSED NATIVE VECTOR WORKER CORE (Halved String Footprint)
const wb=new Blob([`self.onmessage=async function(e){try{const v=new Uint8Array(e.data.b);let q="";for(let i=0;i<v;i++){let b=v[i+1],err=((b*31)+(i*17))%257,vec=((((b&240)>>4|(b&15)<<4)^err)+(i*7))%257;q+=String.fromCharCode(vec&255);}const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(q));self.postMessage({h:Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')});}catch(err){self.postMessage({h:""});}};`],{type:"text/javascript"}),cw=new Worker(URL.createObjectURL(wb));

["HYDRO_MATRIX","XD_OBFUSCATION","DYNAMIC_CANVAS","SECURITY_SEAL"].forEach((n,i)=>{document.getElementById("q").innerHTML+=`<div class="p" id="q${i}"><div class="ph"><span>QTR_${i+_L1} // \${n}</span><span class="ps" id="s${i}">[AES-256 VAULT ENCRYPTED]</span></div></div><div style="height:\${_L3*_L2}px"></div>`;});

window.A=async function(){
    const f=document.getElementById("gk"),nInp=f.value.toLowerCase().trim();
    if(!nInp)return;document.getElementById("gs").innerText="[COMPUTING] Resolving lattice fields...";
    try{
        let sb=new SharedArrayBuffer(128),v=new Uint8Array(sb);v=nInp.length;for(let i=0;i<nInp.length;i++)v[i+1]=nInp.charCodeAt(i);
        const km=new TextEncoder().encode(nInp.padEnd(32,"-").substring(0,32)),ck=await SafeCrypto.importKey("raw",km,"AES-GCM",!1,["decrypt"]);
        km.fill(0);f.value="";cw.postMessage({b:sb});
        cw.onmessage=async function(e){
            try{
                const res=await fetch(KEY_ROUTER_URL),led=await res.json();
                if(led[e.data.h]){
                    const ct=Uint8Array.from(atob(CIPHERTEXT_B64),c=>c.charCodeAt(0)),iv=Uint8Array.from(atob(IV_B64),c=>c.charCodeAt(0)),dB=await SafeCrypto.decrypt({name:"AES-GCM",iv:iv},ck,ct);
                    document.getElementById("tb").innerHTML=`<tr><td><span>0x04</span></td><td>🟢 M4P-V6.99 Core Decentralized Stream</td><td>Lattice Verified</td></tr>`;
                    document.getElementById("b").innerText="ENC_UNLOCKED";document.getElementById("b").className="b u";
                    document.getElementById("gs").innerText="[SUCCESS] Core interlock accepted.";document.getElementById("gs").className="ps v";
                    document.getElementById("dg").style.display="block";new Uint8Array(dB).fill(0);v.fill(0);
                }else throw new Error();
            }catch(err){document.getElementById("gs").innerText="[FAILED] Signature mismatch.";}
        };
    }catch(e){document.getElementById("gs").innerText="[ERROR] Runtime exception.";}
};

// 🌪️ COMPACT GEODETIC 500-NODE LAYER (Rule 1, 2, 3 Compliant)
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),wr=document.getElementById("wr");
let w,h,pts=[],pTime=0,mx=-_L100,my=-_L100;
function resize(){w=wr.clientWidth;h=wr.clientHeight;cv.width=w;cv.height=h;}
window.addEventListener("resize",resize);resize();

for(let i=0;i<(_L100*_L5);i++)pts.push({x:Math.random()*_L100*4,y:Math.random()*_L100*3,idx:i});
wr.addEventListener("mousemove",(e)=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;});
wr.addEventListener("mouseleave",()=>{mx=-_L100;my=-_L100;});

setInterval(()=>{
    cx.fillStyle="#090D16";cx.fillRect(0,0,w,h);pTime+=0.01;
    const b=1+Math.sin(pTime)*0.08;
    for(let i=0;i<pts.length;i++){
        let p=pts[i],tx=p.x*b,ty=p.y;
        if(p.idx%_L2===0)tx*=0.5; // Rule 2 Lossy State Halving
        let dX=tx-mx,dY=ty-my,dist=Math.sqrt(dX*dX+dY*dY);
        if(dist<50){tx+=(dX/dist)*15;ty+=(dY/dist)*15;} // Rule 3 Vector Repulsion
        cx.fillStyle="#0F6";cx.beginPath();cx.arc(tx%w,ty%h,1.5,0,Math.PI*2);cx.fill();
    }
},30);
})();
</script>
