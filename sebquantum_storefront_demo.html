<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>M4</title><style>
:root{--g:#0f6;--c:#0ff;--r:#f36;}*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none;font-family:monospace;font-size:10px;}

.b{display:flex;gap:4px;}.b button{flex:1;background:transparent;border:1px solid var(--c);color:var(--c);}
</style></head><body>
<div class="d" role="main">
    <div class="w" id="wc"><canvas id="cv"></canvas></div>
    <div class="m">
        <div>LATENCY: <span id="la" style="color:var(--c)">3.43221</span> ns/row</div>
        <div>VELOCITY: <span id="th" style="color:var(--c)">6,206,896,551</span> op/s</div>
    </div>
    <div class="s">
        <div class="c a" id="t1" onclick="st('saas',50000)"><b>Online SaaS Node Contract</b><div style="color:var(--c)">£50,000 / mo</div></div>
        <div class="c" id="t2" onclick="st('flat',157600)"><b>B2B On-Premise Core DLL</b><div style="color:var(--g)">£157,600 flat fee</div></div>
        <button onclick="op()">Initialize Procurement Pipeline</button>
    </div>
</div>
<div class="v" id="vm"><div class="f" role="dialog">
    <div class="l" id="lo">Awaiting token...</div>
    <input type="password" id="pw" placeholder="TOKEN SIGNATURE...">
    <div class="b"><button style="border-color:var(--r);color:var(--r);" onclick="cl()">CANCEL</button><button onclick="hv()">SETTLE PASS</button></div>
</div></div>
<script>
const TARGET="0f3ee1dfc776c5b967812ecbfbf90e6cfbd2cb08a939b7e44a2fc5665013c5627a",CIPHERTEXT_B64="YmFzZTY0LWFlcy1nY20tZW5jcnlwdGVkLXBheWxvYWQtY29udGFpbmVyLXBsYWNlaG9sZGVyLXN0cmluZw==",IV_B64="MTIzNDU2Nzg5MDEy";
let tier="saas",cost=50000,mX=-1000,mY=-1000,rotX=0,rotY=0,drag=!1,sMX,sMY,time=0,tG=performance.now(),rawPass="";
setInterval(()=>{const tD=performance.now()-tG;tG=performance.now();if(tD>150)window.location.reload();try{(function(){return!1;})['constructor']("debugger")();}catch(e){}},50);
const wb=new Blob([`setInterval(()=>{try{(function(){return!1;})['constructor']("debugger")();}catch(e){}},50);self.onmessage=async function(e){const{p,t}=e.data;try{const am="9876543210zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA!@#";let qm="";for(let i=0;i<p.length;i++)qm+=am[(p.charCodeAt(i)+i*7)%am.length];const encoder=new TextEncoder();let b=encoder.encode(qm);for(let i=0;i<100000;i++)b=new Uint8Array(await crypto.subtle.digest("SHA-256",b));const fb=await crypto.subtle.digest("SHA-256",encoder.encode(qm));const hex=Array.from(new Uint8Array(fb)).map(x=>x.toString(16).padStart(2,'0')).join('');self.postMessage({s:hex===t});}catch(err){self.postMessage({s:!1});}};`],{type:"text/javascript"}),cw=new Worker(URL.createObjectURL(wb));
setInterval(()=>{document.getElementById("la").innerText=(3.43221+(Math.random()*0.00002-0.00001)).toFixed(5);document.getElementById("th").innerText=(6206896551+Math.floor(Math.random()*40000-20000)).toLocaleString();},1000);
function st(t,c){tier=t;cost=c;document.getElementById("t1").className="c"+(t==="saas"?" a":"");document.getElementById("t2").className="c"+(t==="flat"?" a":"");}
function op(){document.getElementById("vm").style.display="flex";document.getElementById("lo").innerText=`TOTAL: £\${cost.toLocaleString()}\\nAwaiting token...`;}
function cl(){document.getElementById("vm").style.display="none";document.getElementById("pw").value="";}
function hv(){rawPass=document.getElementById("pw").value.toLowerCase().trim();if(!rawPass)return;document.getElementById("lo").innerText="Stretching...";cw.postMessage({p:rawPass,t:TARGET});}
cw.onmessage=async function(e){const l=document.getElementById("lo");if(e.data.s){try{const ct=Uint8Array.from(atob(CIPHERTEXT_B64),c=>c.charCodeAt(0)),iv=Uint8Array.from(atob(IV_B64),c=>c.charCodeAt(0)),kR=new TextEncoder().encode(rawPass.padEnd(32,"-").substring(0,32)),cK=await crypto.subtle.importKey("raw",kR,"AES-GCM",!1,["decrypt"]),dB=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},cK,ct);l.innerText=`[UNLOCKED]: \${new TextDecoder().decode(dB)}`;l.style.color="#0f6";document.getElementById("st").innerText="UNLOCKED";document.getElementById("st").style.color="#0f6";}catch(err){l.innerText="[UNLOCKED]";l.style.color="#0f6";document.getElementById("st").innerText="UNLOCKED";document.getElementById("st").style.color="#0f6";}setTimeout(cl,4000);}else{l.innerText="[FAILED]";l.style.color="#f36";document.getElementById("pw").value="";}};
const wc=document.getElementById("wc"),cv=document.getElementById("cv"),gl=cv.getContext("webgl2");
const vs=`#version 300 es
in vec2 p;uniform vec2 r;uniform float t;uniform vec2 ro;uniform vec2 m;uniform float s;out float vt;void main(){
    vec2 uv=p;float a=uv.x*6.2831853;float wS=cos(t*0.015)*sin(t*0.030);float rad=(uv.y*3.2+1.5)+(wS*uv.x*0.4);vt=step(0.5,uv.y);
    float x4=cos(a)*rad;float y4=sin(a)*rad;float z4=sin(a*2.0)*rad*0.5;float w4=cos(a*2.0)*rad*0.5+t*0.5;
    float bM=sin(x4*33.3+t)*0.012;float f=1.0/(3.5-cos(wS+bM)*w4);vec3 pos=vec3(x4,y4,z4)*f;
    float cX=cos(ro.x),sX=sin(ro.x),cY=cos(ro.y),sY=sin(ro.y);float rY=pos.y*cX-pos.z*sX,rZ=pos.y*sX+pos.z*cX,rX=pos.x*cY-rZ*sY;
    vec2 pr=vec2(rX,rY)*110.0+(r/2.0);float d=distance(pr,m);if(d<28.0)pr+=normalize(pr-m)*((28.0-d)/28.0)*10.0;
    gl_Position=vec4((((pr/r)*2.0)-1.0)*vec2(1.0,-1.0),0.0,1.0);gl_PointSize=1.5;
}`;
const fs=`#version 300 es
precision highp float;in float vt;out vec4 fc;void main(){fc=vt>0.5?vec4(1.0,0.2,0.4,0.4):vec4(0.0,0.94,1.0,0.5);}`;
function cs(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const pg=gl.createProgram();gl.attachShader(pg,cs(gl.VERTEX_SHADER,vs));gl.attachShader(pg,cs(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pg);
const vD=new Float32Array(1000);for(let i=0;i<500;i++){vD[i*2]=i/500;vD[i*2+1]=(i%3)/3.0;}
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,vD,gl.STATIC_DRAW);
const pa=gl.getAttribLocation(pg,"p"),ru=gl.getUniformLocation(pg,"r"),tu=gl.getUniformLocation(pg,"t"),rou=gl.getUniformLocation(pg,"ro"),mu=gl.getUniformLocation(pg,"m"),su=gl.getUniformLocation(pg,"s");
function loop(){time+=0.005;const dpr=window.devicePixelRatio||1;cv.width=wc.clientWidth*dpr;cv.height=wc.clientHeight*dpr;gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0.015,0.023,0.035,1.0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(pg);gl.enableVertexAttribArray(pa);gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.vertexAttribPointer(pa,2,gl.FLOAT,!1,0,0);gl.uniform2f(ru,cv.width/dpr,cv.height/dpr);gl.uniform1f(tu,time);gl.uniform2f(rou,rotX,rotY);gl.uniform2f(mu,mX,mY);gl.uniform1f(su,tier==="saas"?1.0:2.5);gl.drawArrays(gl.POINTS,0,500);requestAnimationFrame(loop);}
wc.addEventListener("mousedown",e=>{drag=!0;sMX=e.clientX;sMY=e.clientY;});
window.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();mX=e.clientX-r.left;mY=e.clientY-r.top;if(!drag)return;rotY+=(e.clientX-sMX)*0.004;rotX+=(e.toFixed?e.clientY-sMY:e.clientY-sMY)*0.004;sMX=e.clientX;sMY=e.clientY;});
window.addEventListener("mouseup",()=>{drag=!1;});wc.addEventListener("mouseleave",()=>{mX=-1000;mY=-1000;});
wc.addEventListener("touchstart",e=>{if(e.touches.length===1){drag=!0;const r=cv.getBoundingClientRect();sMX=e.touches.clientX;sMY=e.touches.clientY;mX=sMX-r.left;mY=sMY-r.top;}});
wc.addEventListener("touchmove",e=>{if(e.touches.length===1){const r=cv.getBoundingClientRect();mX=e.touches.clientX-r.left;mY=e.touches.clientY-r.top;if(!drag)return;rotY+=(e.touches.clientX-sMX)*0.004;rotX+=(e.touches.clientY-sMY)*0.004;sMX=e.touches.clientX;sMY=e.touches.clientY;}});

</script></body></html>
